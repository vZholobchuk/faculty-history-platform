<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Адмін-панель | ПНУ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4 shadow">
        <div class="container">
            <span class="navbar-brand">⚙️ Панель Редактора ПНУ</span>
            <a href="index.html" class="btn btn-outline-light btn-sm">Вийти на сайт</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-md-3">
                <div class="list-group shadow-sm">
                    <button class="list-group-item list-group-item-action active">Додати подію</button>
                    <button class="list-group-item list-group-item-action">Завантажити фото/відео</button>
                    <button class="list-group-item list-group-item-action">Редагувати архів</button>
                    <button class="list-group-item list-group-item-action text-danger">Видалити запис</button>
                </div>
            </div>

            <div class="col-md-9">
                <div class="card shadow-sm p-4">
                    <h3>Створення нової картки події</h3>
                    <hr>
                    <form>
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label class="form-label fw-bold">Дата/Рік</label>
                                <input type="text" class="form-control" placeholder="напр. 2024">
                            </div>
                            <div class="col-md-8 mb-3">
                                <label class="form-label fw-bold">Назва події</label>
                                <input type="text" class="form-control" placeholder="Введіть коротку назву">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Опис події</label>
                            <textarea class="form-control" rows="4"></textarea>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Категорія</label>
                                <select class="form-select">
                                    <option>Освіта</option>
                                    <option>Наука</option>
                                    <option>Студенти</option>
                                    <option>Міжнародні проекти</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-bold">Завантажити медіа</label>
                                <input type="file" class="form-control">
                            </div>
                        </div>
                        <div class="mt-3 text-end">
                            <button type="reset" class="btn btn-secondary me-2">Очистити</button>
                            <button type="submit" class="btn btn-primary px-5">Опублікувати на сайті</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
