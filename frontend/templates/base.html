<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}КНУ{% endblock %}</title>

    {% block links %} 
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    {% endblock %}
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="{{url_for('home')}}">КНУ Історія</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link active" href="{{url_for('home')}}">Головна</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{url_for('timeline')}}">Хронологія</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{url_for('archive')}}">Архів</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{url_for('gallery')}}">Галерея</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{url_for('persons')}}">Постаті</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{url_for('admin')}}">Адмін-панель</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    {% block footer %}{% endblock %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
