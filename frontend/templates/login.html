{% extends 'base.html' %}

{% block title %} Вхід | ПНУ Історія {% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <div class="text-center mb-4">
            <h2 class="fw-bold">Вхід</h2>
            <p class="text-muted">Для адміністраторів платформи</p>
        </div>

        <form id="loginPageForm">
            <div class="mb-3">
                <label class="form-label">Логін</label>
                <input type="text" class="form-control" id="pageLoginUsername" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Пароль</label>
                <input type="password" class="form-control" id="pageLoginPassword" required>
            </div>
            <div class="text-danger mb-3 d-none" id="pageLoginError">Невірний логін або пароль</div>

            <button type="submit" class="btn btn-primary w-100 py-2">Увійти</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('api.register') }}" class="small">Реєстрація нового адміністратора</a>
        </div>
    </div>
</div>

<script>
    document.getElementById('loginPageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const username = document.getElementById('pageLoginUsername').value;
        const password = document.getElementById('pageLoginPassword').value;

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('access_token', data.access_token);
                window.location.href = '/admin';
            } else {
                document.getElementById('pageLoginError').classList.remove('d-none');
            }
        } catch (err) {
            console.error(err);
        }
    });
</script>
{% endblock %}
